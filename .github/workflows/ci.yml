name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓 checkout 到仓名目录（跨仓 ProjectReference 解析到同级 <dep>/ 目录）
      - uses: actions/checkout@v4
        with:
          path: aether-ai-integrations
      # 跨仓依赖（本地 ProjectReference 拓扑——切 PackageReference 后可移除）：
      # Ledger 适配器 → ⑫ aether-ai（传递：Harness/Core/Memory…）+ ① aether-ledger
      # SystemTools 适配器 → ⑫ aether-ai 一个仓（工具池/审批/宿主过滤全在平台层）
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-ai
          path: aether-ai
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-ledger
          path: aether-ledger
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）。
      # 依赖仓为私有仓时 GITHUB_TOKEN 默认不能跨仓读取——需在 org Settings → Actions →
      # General 开放 accessible repositories，或改用 PAT secret。
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile aether-ai-integrations/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Build
        run: dotnet build aether-ai-integrations.slnx -c Release
        working-directory: aether-ai-integrations

      # 2026-10-23 随迁测试：5 例真链回环（进程内节点 + 签名转账/充值路径 + 种子文件生命周期）
      # + 1 例 DI 接线钉子（AddLedgerTools → ToolRegistry 四工具与审批等级）
      # + 7 例系统工具（DI 元数据/真实文件系统行为/AIFunction 参数绑定/规则大脑调工具闭环）。
      - name: Test
        run: dotnet test aether-ai-integrations.slnx -c Release --no-build
        working-directory: aether-ai-integrations

      # 示例冒烟：规则大脑经 Harness 调用真实系统工具（ReadFile / ExploreDirectory）。
      # 断言本身在 tests/Aether.SystemTools.AI.Tests；这里只验证公开入口在干净宿主里能跑起来。
      - name: Run sample host
        run: dotnet run --project samples/Aether.SystemTools.AI.Sample -c Release --no-build
        working-directory: aether-ai-integrations
